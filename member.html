<style>

    --ink:#1A2430; --ink-soft:#4A5864; --ink-mute:#66727E;
    --paper:#F2F4F6; --card:#FFFFFF; --line:#E3E7EB; --line-soft:#EDF0F2;
    --green:#2B7A5B; --green-soft:#E4F1EB; --rust:#A33F2D; --rust-soft:#F6E3DE;
    --amber:#9A6416; --amber-soft:#F7ECDA; --blue:#3A5A78; --info-soft:#E4ECF3;

    --shadow:0 1px 3px rgba(16,32,40,.06);
  }
  html[data-theme="dark"]{
    --ink:#E6ECEA; --ink-soft:#B8C4BF; --ink-mute:#8FA39B;

    --green:#4FB68B; --green-soft:#173A2E; --rust:#E58A74; --rust-soft:#3A2420;
    --amber:#D9A24A; --amber-soft:#3A2F18; --blue:#8DB4D8; --info-soft:#1F3040;
    --hdr:#0B2E25; --btn:#2C7F63; --shadow:none;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; background:var(--paper); color:var(--ink); }
  body{ font-family:'Noto Sans Devanagari','Segoe UI',Roboto,system-ui,sans-serif; font-size:16px; line-height:1.4; min-height:100vh; padding-bottom:calc(76px + env(safe-area-inset-bottom)); }
  .band{ background:var(--hdr); color:#fff; padding:calc(14px + env(safe-area-inset-top)) 16px 14px; display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:5; }
  .band img{ width:46px; height:46px; border-radius:50%; flex:none; }
  .band .t{ flex:1; min-width:0; }
  .band .t small{ display:block; font-size:12.5px; color:#B9D2CA; }
  .band .t b{ display:block; font-size:18px; line-height:1.15; }
  .band button{ background:transparent; color:#fff; border:1.5px solid rgba(255,255,255,.35); border-radius:999px; height:42px; min-width:42px; padding:0 14px; font:inherit; font-size:14px; }
  main{ padding:14px 16px 24px; max-width:640px; margin:0 auto; }
  h2{ font-size:20px; margin:6px 0 12px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin:0 0 12px; box-shadow:var(--shadow); }
  .lbl{ font-size:12.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-mute); margin:0 0 8px; }
  .sub{ color:var(--ink-soft); font-size:14.5px; margin:4px 0; }
  .stats{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:0 0 12px; }
  .stat{ border-radius:var(--radius); padding:14px; border:1px solid var(--line); background:var(--card); }
  .stat span{ display:block; font-size:12.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-mute); }
  .stat b{ display:block; font-size:26px; margin-top:4px; }
  .stat.paid{ background:var(--green-soft); } .stat.paid b{ color:var(--green); }
  .stat.owe{ background:var(--amber-soft); } .stat.owe b{ color:var(--amber); }
  .row{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding:10px 0; border-bottom:1px solid var(--line-soft); }
  .row:last-child{ border-bottom:0; }
  .row .n{ min-width:0; overflow-wrap:anywhere; }
  .row .n small, .row .a small{ display:block; font-size:12.5px; color:var(--ink-mute); margin-top:2px; }
  .row .a{ text-align:right; white-space:nowrap; }
  .pill{ display:inline-block; font-size:12.5px; padding:3px 10px; border-radius:999px; border:1px solid var(--line); color:var(--ink-soft); }
  .pill.ok{ color:var(--green); border-color:var(--green); background:var(--green-soft); }
  .pill.bad{ color:var(--rust); border-color:var(--rust); background:var(--rust-soft); }
  .pill.warn{ color:var(--amber); border-color:var(--amber); background:var(--amber-soft); }
  .note{ border-radius:var(--radius); padding:12px 14px; margin:0 0 12px; font-size:15px; }
  .note.ok{ background:var(--green-soft); border:1px solid var(--green); }
  .note.bad{ background:var(--rust-soft); border:1px solid var(--rust); }
  .note.bday{ background:linear-gradient(135deg,var(--amber-soft),var(--green-soft)); border:1px solid var(--amber); text-align:center; font-size:17px; }
  details{ margin-top:6px; } summary{ cursor:pointer; padding:10px 0; font-weight:600; }
  .months{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .m{ border:1px solid var(--line); border-radius:10px; padding:8px 4px; text-align:center; font-size:13.5px; }
  .m i{ display:block; font-style:normal; font-size:12px; margin-top:2px; color:var(--ink-mute); }
  .m.p{ background:var(--green-soft); border-color:var(--green); } .m.p i{ color:var(--green); }
  .m.d{ background:var(--rust-soft); border-color:var(--rust); } .m.d i{ color:var(--rust); }
  .m.f{ opacity:.55; }
  .loan .top{ display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:6px; }
  .loan .top b{ font-size:20px; }
  .kv{ display:flex; justify-content:space-between; gap:12px; padding:7px 0; border-bottom:1px solid var(--line-soft); font-size:15px; }
  .kv:last-child{ border-bottom:0; } .kv b{ text-align:right; }

  .login h1{ font-size:24px; margin:0 0 4px; } .login p{ margin:0 0 18px; color:#B9D2CA; font-size:15px; text-align:center; }
  .login form{ width:100%; max-width:340px; display:flex; flex-direction:column; gap:12px; }
  .login input{ width:100%; height:52px; border-radius:12px; border:0; padding:0 16px; font:inherit; font-size:18px; letter-spacing:.04em; color:#1A2430; background:#fff; }
  .login .go{ height:52px; border-radius:12px; border:0; background:#E9C46A; color:#2b2108; font:inherit; font-size:17px; font-weight:700; }
  .login .go[disabled]{ opacity:.6; }
  .login .err{ background:#F6E3DE; color:#7a2a1b; border-radius:10px; padding:10px 12px; font-size:14.5px; display:none; }
  .login .tools{ margin-top:16px; display:flex; gap:10px; }
  .login .tools button{ background:transparent; color:#fff; border:1.5px solid rgba(255,255,255,.4); border-radius:999px; height:40px; padding:0 16px; font:inherit; font-size:14px; }
  .login small{ margin-top:18px; color:#B9D2CA; text-align:center; max-width:320px; }
  /* tabs */
  nav{ position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--line); display:grid; grid-template-columns:repeat(4,1fr); padding-bottom:env(safe-area-inset-bottom); z-index:6; }
  nav button{ background:none; border:0; padding:10px 4px 8px; font:inherit; font-size:12.5px; color:var(--ink-mute); display:flex; flex-direction:column; align-items:center; gap:3px; }
  nav button svg{ width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  nav button.on{ color:var(--green); font-weight:700; }
  nav button.on span.ic{ background:var(--green-soft); border-radius:999px; padding:3px 18px; } nav button span.ic{ padding:3px 18px; }
  .btn{ display:block; width:100%; height:48px; border-radius:12px; border:1.5px solid var(--line); background:var(--card); color:var(--ink); font:inherit; font-size:16px; margin:8px 0 0; }
  .btn.pri{ background:var(--btn); color:var(--on-btn); border-color:var(--btn); }
  .skel{ height:16px; border-radius:8px; background:var(--line-soft); margin:10px 0; animation:pulse 1.2s infinite ease-in-out; }
  @keyframes pulse{ 50%{ opacity:.45; } }
  .toast{ position:fixed; left:50%; bottom:90px; transform:translateX(-50%); background:#10181f; color:#fff; padding:10px 16px; border-radius:999px; font-size:14px; display:none; z-index:20; max-width:90%; text-align:center; }
  .rules p{ margin:0 0 10px; }
  [hidden]{ display:none !important; }
</style>

    document.querySelectorAll('[data-i]').forEach(function(e){ e.textContent = t(e.getAttribute('data-i')); });
    document.querySelectorAll('[data-ph]').forEach(function(e){ e.placeholder = t(e.getAttribute('data-ph')); });
    var lb = LANG === 'mr' ? 'English' : 'मराठी';
    $('lgLang').textContent = lb; $('hdLang').textContent = lb;
    $('hdrSub').textContent = t('member');
    if(D) render();
  }
  function setTheme(){ var d = document.documentElement.getAttribute('data-theme') === 'dark'; if(d){ document.documentElement.removeAttribute('data-theme'); ls('withusMemTheme', 'light'); } else { document.documentElement.setAttribute('data-theme', 'dark'); ls('withusMemTheme', 'dark'); } }
  function toggleLang(){ LANG = LANG === 'mr' ? 'en' : 'mr'; ls('withusMemLang', LANG); applyLang(); }

  /* ---- sign in / out ---- */
  function showLogin(msg){
    $('appView').hidden = true; $('loginView').hidden = false; D = null;
    var e = $('loginErr'); if(msg){ e.textContent = msg; e.style.display = 'block'; } else e.style.display = 'none';
  }
  function showApp(){ $('loginView').hidden = true; $('appView').hidden = false; }
  $('loginForm').addEventListener('submit', function(ev){
    ev.preventDefault();
    var mob = $('inMob').value.replace(/\D/g, ''), pin = $('inPin').value.replace(/\D/g, '');
    if(mob.length < 10 || pin.length !== 6){ showLogin(t('errFill')); return; }
    var b = $('goBtn'); b.disabled = true;
    call({ kind:'memberLogin', mobile:mob, pin:pin, dev:dev }).then(function(res){
      b.disabled = false;
      if(res && res.ok){ TK = res.token; ls('withusMemToken', TK); $('inPin').value = ''; boot(); return; }
      if(res && res.error === 'locked') showLogin(t('errLocked', { m:res.minutes || 15 }));
      else showLogin(t('errBad') + (res && res.left ? t('errLeft', { n:res.left }) : ''));
    }).catch(function(){ b.disabled = false; showLogin(t('errNet')); });
  });
  function signOut(){
    var tk = TK; TK = ''; ls('withusMemToken', null); D = null;
    try{ fetch(SYNC_URL, { method:'POST', body:JSON.stringify({ kind:'meLogout', token:tk }) }); }catch(e){}
    showLogin('');
  }

  /* ---- data ---- */
  function load(force){
    if(!force){ try{ var c = JSON.parse(ls('withusMemCache') || 'null'); if(c && c.id){ D = c; render(); } }catch(e){} }
    if(!D) $('main').innerHTML = '<div class="card"><div class="skel"></div><div class="skel" style="width:70%"></div><div class="skel" style="width:85%"></div></div>';
    return call({ kind:'meData' }).then(function(res){
      if(res && res.error === 'bad-session'){ TK = ''; ls('withusMemToken', null); ls('withusMemCache', null); showLogin(t('signedOut')); return; }
      if(res && res.ok){ D = res; ls('withusMemCache', JSON.stringify(res)); render(); }
      else if(!D) say(t('errNet'));
    }).catch(function(){ if(!D) say(t('errNet')); });
  }
  function boot(){ showApp(); setTab(TAB); load(false); }

  /* ---- views ---- */
  function row(n, sub, a, asub){ return '<div class="row"><div class="n">' + esc(n) + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</div><div class="a"><b>' + esc(a) + '</b>' + (asub ? '<small>' + esc(asub) + '</small>' : '') + '</div></div>'; }
  function kv(k, v){ return '<div class="kv"><span>' + esc(k) + '</span><b>' + esc(v) + '</b></div>'; }
  function loanStatus(l){ var s = String(l.status || ''); var m = { Active:['sActive', 'ok'], Defaulted:['sDefaulted', 'bad'], Closed:['sClosed', ''], Complete:['sComplete', ''], Overdue:['sOverdue', 'bad'] }[s]; return m ? '<span class="pill ' + m[1] + '">' + esc(t(m[0])) + '</span>' : '<span class="pill">' + esc(s) + '</span>'; }
  function isOpen(l){ return l.status !== 'Closed' && l.status !== 'Complete'; }
  function loanCard(l){
    var h = '<div class="card loan"><div class="top"><b>' + esc(money(l.amount)) + ' · ' + esc(l.id) + '</b>' + loanStatus(l) + '</div>';
    h += kv(t('taken'), dmy(l.taken)) + kv(t('due'), dmy(l.due));
    h += kv(t('extra'), money(l.extra));
    if(l.late > 0) h += kv(t('late'), money(l.late));
    h += kv(t('total'), money(l.total)) + kv(t('paidSoFar'), money(l.paid));
    if(isOpen(l)) h += '<div class="kv"><span>' + esc(t('balance')) + '</span><b style="color:var(--rust)">' + esc(money(l.outstanding)) + '</b></div>';
    else if(l.closedDate) h += kv(t('closed'), dmy(l.closedDate));
    if((l.guarantors || []).length) h += kv(t('guarantors'), l.guarantors.join(', '));
    return h + '</div>';
  }
  function guarRow(g){ return row(g.borrower || '-', g.loan, money(g.amount), dmy(g.due)); }
  function blockText(b){
    if(b.type === 'arrears') return t('bArrears', { m:b.months.map(mlabel).join(', '), a:money(b.amount) });
    if(b.type === 'penalty') return t('bPenalty', { a:money(b.amount) });
    if(b.type === 'suspended') return t('bSusp');
    if(b.type === 'exited') return t('bExit');
    if(b.type === 'loan-suspension') return t('bLoanSusp', { d:dmy(b.until) });
    return '';
  }
  function isBirthday(){
    if(!D.dob || !D.today) return 0;
    var m = /^\d{4}-(\d{2})-(\d{2})/.exec(D.dob); if(!m) return 0;
    var y = +D.today.slice(0, 4), tdy = new Date(Date.UTC(y, +D.today.slice(5, 7) - 1, +D.today.slice(8, 10)));
    var b = new Date(Date.UTC(y, +m[1] - 1, +m[2]));
    var diff = Math.round((tdy - b) / 86400000);
    return diff === 0 ? 1 : diff === 1 ? 2 : 0;
  }
  function vHome(){
    var h = '', bd = isBirthday();
    if(bd) h += '<div class="note bday">🎂 ' + esc(t(bd === 1 ? 'bday' : 'bdayLate')) + ', ' + esc((D.name || '').split(' ')[0]) + '!</div>';
    h += '<h2>' + esc(t('hello')) + ', ' + esc(D.name) + '</h2>';
    h += '<div class="stats"><div class="stat paid"><span>' + esc(t('deposits')) + '</span><b>' + esc(money(D.deposit)) + '</b></div><div class="stat owe"><span>' + esc(t('owe')) + '</span><b>' + esc(money(D.owed)) + '</b></div></div>';
    h += '<div class="card"><p class="lbl">' + esc(t('whatOwed')) + '</p>';
    var n = 0;
    (D.arrears || []).forEach(function(m){ n++; h += row(t('contribFor') + ' · ' + mlabel(m), '', money(D.amount)); });
    if(D.dueNow){ n++; h += row(t('contribFor') + ' · ' + mlabel(D.month), t('dueThisMonth'), money(D.amount)); }
    (D.penalties || []).forEach(function(p){ if(p.outstanding > 0){ n++; h += row(t('penalty') + ' · ' + mlabel(p.month), '', money(p.outstanding)); } });
    (D.penaltyPending || []).forEach(function(m){ n++; h += row(t('penalty') + ' · ' + mlabel(m), t('notCharged'), money(D.penaltyAmount)); });
    if(!n) h += '<p class="sub">' + esc(t('nothingOwed')) + '</p>';
    h += '</div>';
    var open = (D.loans || []).filter(isOpen);
    h += '<div class="card"><p class="lbl">' + esc(t('loanStanding')) + '</p>';
    if(!open.length) h += '<p class="sub">' + esc(t('noLoan')) + '</p>';
    open.forEach(function(l){ h += row(money(l.amount) + ' · ' + l.id, t('due') + ' ' + dmy(l.due), money(l.outstanding), t('balance')); });
    h += '</div>';
    var go = (D.guarantorFor || []).filter(function(g){ return g.st !== 'Closed'; });
    h += '<div class="card"><p class="lbl">' + esc(t('guarOf')) + '</p>' + (go.length ? go.map(guarRow).join('') : '<p class="sub">' + esc(t('noGuar')) + '</p>') + '</div>';
    var bl = (D.blocks || []).map(blockText).filter(Boolean);
    h += '<div class="note ' + (D.canApply && D.canGuarantee ? 'ok' : 'bad') + '"><b>' + esc(t('elig')) + '</b><br>' + bl.map(function(x){ return esc(x); }).join('<br>') + (bl.length ? '<br>' : '') + esc(D.canApply ? t('canApply') : t('cannotApply')) + ' ' + esc(D.canGuarantee ? t('canGuar') : t('cannotGuar')) + '</div>';
    h += '<p class="sub" style="text-align:center">' + esc(t('view')) + '</p>';
    return h;
  }
  function vContrib(){
    var y = D.today ? D.today.slice(0, 4) : String(new Date().getFullYear()), paid = {};
    (D.paidMonths || []).forEach(function(m){ paid[m] = 1; });
    var h = '<h2>' + esc(t('tContrib')) + '</h2><div class="card"><p class="lbl">' + esc(t('thisYear')) + ' ' + esc(y) + '</p><div class="months">';
    for(var i = 1; i <= 12; i++){
      var ym = y + '-' + ('0' + i).slice(-2), isPaid = !!paid[ym], future = ym > D.month, owes = (D.arrears || []).indexOf(ym) >= 0 || (ym === D.month && D.dueNow);
      h += '<div class="m ' + (isPaid ? 'p' : owes ? 'd' : future ? 'f' : '') + '">' + esc(MON[LANG][i - 1]) + '<i>' + (isPaid ? esc(t('paid')) : owes ? esc(t('unpaid')) : '&nbsp;') + '</i></div>';
    }
    h += '</div></div>';
    h += '<div class="card"><p class="lbl">' + esc(t('penalties')) + '</p>';
    var pl = (D.penalties || []).slice().reverse();
    if(!pl.length && !(D.penaltyPending || []).length) h += '<p class="sub">' + esc(t('noPen')) + '</p>';
    (D.penaltyPending || []).forEach(function(m){ h += row(mlabel(m), t('notCharged'), money(D.penaltyAmount)); });
    pl.forEach(function(p){
      var st = p.status === 'Waived' ? t('penWaived') : p.status === 'Paid' ? t('penPaid') : p.status === 'Part paid' ? t('penPart') : t('penUnpaid');
      h += row(mlabel(p.month), st, money(p.amount), p.outstanding > 0 ? t('penOut', { a:money(p.outstanding) }) : '');
    });
    h += '</div><div class="card"><p class="lbl">' + esc(t('receipts')) + '</p>';
    var rc = D.receipts || [];
    if(!rc.length) h += '<p class="sub">' + esc(t('noReceipts')) + '</p>';
    rc.forEach(function(r){ h += row((r.months || []).map(function(m){ return MON[LANG][+m.slice(5, 7) - 1]; }).join(', ') + ' ' + ((r.months || [''])[0] || '').slice(0, 4), dmy(r.date) + (r.receipt ? ' · ' + r.receipt : '') + (r.mode ? ' · ' + r.mode : ''), money(r.amount)); });
    return h + '</div>';
  }
  function vLoans(){
    var all = D.loans || [], open = all.filter(isOpen), past = all.filter(function(l){ return !isOpen(l); });
    var h = '<h2>' + esc(t('tLoans')) + '</h2>';
    h += '<p class="lbl">' + esc(t('openLoans')) + '</p>' + (open.length ? open.map(loanCard).join('') : '<div class="card"><p class="sub">' + esc(t('noLoan')) + '</p></div>');
    if(past.length) h += '<details class="card"><summary>' + esc(t('pastLoans')) + ' (' + past.length + ')</summary>' + past.map(loanCard).join('') + '</details>';
    var go = (D.guarantorFor || []).filter(function(g){ return g.st !== 'Closed'; }), gp = (D.guarantorFor || []).filter(function(g){ return g.st === 'Closed'; });
    h += '<div class="card"><p class="lbl">' + esc(t('guarOf')) + '</p>' + (go.length ? go.map(guarRow).join('') : '<p class="sub">' + esc(t('noGuar')) + '</p>');
    if(gp.length) h += '<details><summary>' + esc(t('pastGuar')) + ' (' + gp.length + ')</summary>' + gp.map(guarRow).join('') + '</details>';
    return h + '</div>';
  }
  function vYou(){
    var h = '<h2>' + esc(t('tYou')) + '</h2><div class="card"><p class="lbl">' + esc(t('profile')) + '</p>' + kv(t('member'), D.name) + kv(t('memberId'), D.id) + (D.joinDate ? kv(t('since'), dmy(D.joinDate)) : '') + kv(t('dataAsOf'), dmy(D.today)) + '</div>';
    var rules = (D.rules && D.rules[LANG]) ? String(D.rules[LANG]).split(/\n+/).map(function(x){ return '<p>' + esc(x) + '</p>'; }).join('') :
      '<p>' + esc(t('r1', { a:money(D.amount) })) + '</p><p>' + esc(t('r2', { p:money(D.penaltyAmount) })) + '</p><p>' + esc(t('r3')) + '</p><p>' + esc(t('r4')) + '</p><p>' + esc(t('r5')) + '</p>';
    h += '<details class="card rules"><summary>' + esc(t('rules')) + '</summary>' + rules + '</details>';
    h += '<button type="button" class="btn" id="btnLang">' + esc(t('language')) + ': ' + (LANG === 'mr' ? 'English' : 'मराठी') + '</button><button type="button" class="btn" id="btnRef">' + esc(t('refresh')) + '</button><button type="button" class="btn pri" id="btnOut">' + esc(t('signOut')) + '</button>';
    h += '<p class="sub" style="text-align:center;margin-top:14px">' + esc(t('version')) + ' ' + esc(BUILD) + '</p>';
    return h;
  }
  function render(){
    if(!D) return;
    $('main').innerHTML = TAB === 'contrib' ? vContrib() : TAB === 'loans' ? vLoans() : TAB === 'you' ? vYou() : vHome();
    document.querySelectorAll('nav button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-tab') === TAB); });
    var o = $('btnOut'); if(o){ o.onclick = signOut; $('btnLang').onclick = toggleLang; $('btnRef').onclick = function(){ load(true).then(function(){ say(t('dataAsOf') + ' ' + dmy(D && D.today)); }); }; }
  }
  function setTab(x){ TAB = x; if(D) render(); else document.querySelectorAll('nav button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-tab') === TAB); }); window.scrollTo(0, 0); }
  document.querySelectorAll('nav button').forEach(function(b){ b.addEventListener('click', function(){ setTab(b.getAttribute('data-tab')); }); });
  $('lgLang').onclick = toggleLang; $('hdLang').onclick = toggleLang; $('lgTheme').onclick = setTheme; $('hdTheme').onclick = setTheme;

  applyLang();
  if(TK){ showApp(); setTab('home'); load(false); } else showLogin('');
})();
</script>
</body>
</html>
